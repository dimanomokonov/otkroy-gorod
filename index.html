<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Открой город">
<meta name="theme-color" content="#4b2fd6">
<title>Открой город</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --land:#e2e6df;--water:#b9d4dc;--park:#cfe0c2;--road:#fbfcf8;--roadEdge:#cfd6cb;
  --ink:#16202a;--muted:#5f6b72;--panel:#ffffff;--line:#e3e8e2;--soft:#f2f5f1;
  --fog:#1e2433;--mine:#7a4cf0;--main:#d6334b;--local:#1e9e8a;--food:#e8931a;--me:#2f6feb;
  --shadow:0 6px 24px rgba(22,32,42,.16);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --land:#20262d;--water:#172f39;--park:#1f2c24;--road:#2c343b;--roadEdge:#151a1f;
  --ink:#eef2ee;--muted:#98a4a8;--panel:#141a20;--line:#27303a;--soft:#1c232a;--fog:#05070b;--mine:#9b78ff;
  --shadow:0 6px 24px rgba(0,0,0,.5);}}
:root[data-theme="dark"]{
  --land:#20262d;--water:#172f39;--park:#1f2c24;--road:#2c343b;--roadEdge:#151a1f;
  --ink:#eef2ee;--muted:#98a4a8;--panel:#141a20;--line:#27303a;--soft:#1c232a;--fog:#05070b;--mine:#9b78ff;
  --shadow:0 6px 24px rgba(0,0,0,.5);}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{height:100%;margin:0;background:var(--panel);color:var(--ink);font:15px/1.45 Rubik,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:2px solid var(--me);outline-offset:2px}
#app{position:relative;height:100%;max-width:560px;margin:0 auto;overflow:hidden;background:var(--land)}
#map{position:absolute;inset:0;background:var(--land);z-index:0}
#fog{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:500}

.dpick.on{display:block}
.prow{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:14px}
.prow.on{background:var(--soft)}
.prow .l{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.prow b{font-weight:800}
.prow small{color:var(--muted);font-size:12.5px;display:block}
.prow .pp{font:800 14px Rubik,sans-serif;flex:none}
.prow .bar{display:block;margin:7px 0 0}





.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 6px;border-bottom:1px solid var(--line)}
.dot{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:20px;flex:none;background:var(--soft)}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t span{font-size:13px;color:var(--muted)}
.tag{font-weight:800;font-size:12.5px;padding:4px 8px;border-radius:9px;background:var(--soft);flex:none}
.tag.ok{background:var(--local);color:#fff}

.dist{padding:12px 4px;border-bottom:1px solid var(--line)}
.dist h3{margin:0;display:flex;justify-content:space-between;align-items:baseline;font:800 15px Rubik,sans-serif}
.dist h3 span{font:700 13px Rubik,sans-serif;color:var(--muted)}
.bar{height:8px;border-radius:9px;background:var(--soft);margin:8px 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--local);border-radius:9px}
.dist p{margin:4px 0 0;font-size:13.5px;color:var(--muted)}
.dist p b{color:var(--ink)}

.seg{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:12px;margin:4px 0 8px}
.seg button{flex:1;padding:7px;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--ink)}
.row{display:flex;align-items:center;gap:12px;padding:9px 6px;border-bottom:1px solid var(--line)}
.row .n{width:24px;font:800 13px Rubik,sans-serif;color:var(--muted)}
.row .nm{flex:1}
.row.me{background:var(--soft);border-radius:12px}
.row .sc{font-weight:800}
.ghost{width:100%;margin-top:14px;padding:12px;border-radius:14px;background:var(--soft);font-weight:700}
.note{font-size:12.5px;color:var(--muted);margin:12px 4px 0}

.scrim{position:fixed;inset:0;z-index:900;background:rgba(10,14,20,.45);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.card{position:fixed;z-index:1000;left:50%;bottom:0;width:100%;max-width:560px;max-height:82%;overflow-y:auto;transform:translate(-50%,105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);background:var(--panel);border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px))}
.card.on{transform:translate(-50%,0)}
.card .hd{display:flex;gap:14px;align-items:center}
.card .big{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:30px;flex:none}
.card h2{margin:0;font:800 20px/1.15 Rubik,sans-serif;letter-spacing:-.02em}
.card .zh{color:var(--muted);font-size:14px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.meta span{font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:99px;background:var(--soft)}
.story{font-size:15.5px;line-height:1.6;margin:0}
.lock{padding:14px;border-radius:16px;background:var(--soft);font-size:14px;color:var(--muted)}
.lock b{color:var(--ink)}
.cta{width:100%;margin-top:14px;padding:14px;border-radius:16px;background:var(--me);color:#fff;font-weight:800;font-size:15px}
.close{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:12px;background:var(--soft);font-size:18px}

.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast b{font-weight:800}
.toast button{margin-left:auto;padding:8px 12px;border-radius:12px;background:var(--me);color:#fff;font-weight:700;font-size:13px;flex:none}
.fl{display:block;font-weight:700;font-size:13px;color:var(--muted);margin-top:14px}
.fl input,.fl textarea{display:block;width:100%;margin-top:6px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font:inherit;font-size:16px;resize:vertical}
.types{display:flex;gap:6px;margin-top:14px}
.types button{flex:1;padding:10px 4px;border-radius:14px;background:var(--soft);font-weight:700;font-size:14px}
.types button.on{background:var(--mine);color:#fff}
.photo{display:block;margin-top:14px;padding:14px;border-radius:14px;border:1.5px dashed var(--line);text-align:center;font-weight:700;cursor:pointer;color:var(--muted)}
.photo img{width:100%;border-radius:12px;display:block}
.mimg{width:100%;border-radius:16px;margin:14px 0 6px;display:block}
.thumb{width:40px;height:40px;border-radius:14px;object-fit:cover;flex:none}
.acts{display:flex;gap:8px}
.acts .ghost{margin-top:4px}
.danger{color:var(--main)}
.cta.mine{background:var(--mine)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.leaflet-bottom.leaflet-left{bottom:0}
.leaflet-control-attribution{font-size:9px;opacity:.55;background:transparent!important}
.leaflet-tile-pane{filter:saturate(.4)}
#app.soft .leaflet-tile-pane{filter:none}
#app.amap .leaflet-tile-pane{filter:grayscale(1) contrast(.85) brightness(1.08)}
.glass{background:var(--panel);background:color-mix(in srgb,var(--panel) 86%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid color-mix(in srgb,var(--ink) 8%,transparent);box-shadow:0 2px 14px rgba(0,0,0,.12)}
.top{position:absolute;z-index:600;top:10px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:5px 14px 5px 5px;border-radius:99px;max-width:calc(100% - 20px);cursor:pointer}
.ring{position:relative;width:36px;height:36px;flex:none}
.ring svg{transform:rotate(-90deg);display:block}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:800 9.5px Rubik,sans-serif}
.city{min-width:0}
#cityLine{display:none}
#dName{display:block;font:800 14px/1.2 Rubik,sans-serif;letter-spacing:-.01em}
#dName::after{content:' ▾';font-size:10px;color:var(--muted)}
#area{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pts{flex:none;padding-left:10px;border-left:1px solid var(--line);text-align:center}
.pts b{display:block;font:800 12px/1.2 Rubik,sans-serif}
.pts span{font-size:10px;color:var(--muted)}
.dpick{position:absolute;z-index:650;top:62px;left:10px;right:10px;border-radius:18px;padding:6px;display:none;max-height:62%;overflow-y:auto}
.dpick.on{display:block}
.rail{position:absolute;z-index:600;right:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.ib svg,.add svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib.on{color:var(--me)}
.add{position:absolute;z-index:600;right:10px;bottom:18px;width:46px;height:46px;border-radius:50%;background:var(--mine);color:#fff;display:grid;place-items:center;box-shadow:0 4px 14px rgba(122,76,240,.35)}
.add svg{width:22px;height:22px;stroke-width:2.4}
.pill{position:absolute;z-index:600;left:10px;bottom:22px;max-width:calc(100% - 76px);display:flex;align-items:center;gap:8px;padding:7px 14px 7px 10px;border-radius:99px;font-size:13px;text-align:left}
.pill .e{font-size:15px}
.pill b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill span{color:var(--muted);flex:none}
.pop{position:absolute;z-index:650;right:58px;top:50%;transform:translateY(-50%);width:236px;border-radius:18px;padding:10px;display:none}
.pop.on{display:block}
.pop h4{margin:2px 8px 4px;font-size:11.5px;color:var(--muted);font-weight:700}
.pop hr{border:0;border-top:1px solid var(--line);margin:8px 4px}
.opt,.chip{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border-radius:10px;font-weight:600;font-size:13.5px;text-align:left}
.opt.on{background:var(--soft)}
.opt.on::after{content:'✓';margin-left:auto;color:var(--me);font-weight:800}
.chip i{width:9px;height:9px;border-radius:50%;display:block;flex:none}
.chip[aria-pressed="false"]{opacity:.35}
.toast{position:absolute;z-index:700;left:50%;top:62px;transform:translate(-50%,-14px);opacity:0;pointer-events:none;transition:all .25s;border-radius:16px;padding:9px 10px 9px 14px;display:flex;gap:10px;align-items:center;width:calc(100% - 20px);max-width:420px;font-size:13.5px}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast b{font-weight:800}
.toast button{margin-left:auto;padding:7px 12px;border-radius:12px;background:var(--me);color:#fff;font-weight:700;font-size:13px;flex:none}
.sheet{position:fixed;z-index:950;left:50%;bottom:0;width:100%;max-width:560px;height:80%;transform:translate(-50%,105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);background:var(--panel);border-radius:22px 22px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.open{transform:translate(-50%,0)}
.phd{display:flex;align-items:center;gap:8px;padding:12px 12px 8px;flex:none}
.tabs{flex:1;display:flex;gap:2px}
.tabs button{flex:1;padding:7px 0;border-radius:10px;font-weight:700;font-size:13.5px;color:var(--muted)}
.tabs button.on{background:var(--soft);color:var(--ink)}
.x{width:32px;height:32px;border-radius:10px;background:var(--soft);font-size:17px;flex:none}
.body{flex:1;overflow-y:auto;padding:0 12px 16px;-webkit-overflow-scrolling:touch}

#map{background:var(--soft)}
.dlabel span{position:absolute;transform:translate(-50%,-50%);font:800 10.5px Rubik,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);opacity:.55;white-space:nowrap}
.btn{background:var(--panel);border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.2);color:var(--ink)}
.corner{position:absolute;z-index:600}
.btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sq{width:52px;height:52px;display:grid;place-items:center}
#meBtn{top:10px;left:10px;width:52px;height:52px;display:grid;place-items:center}
#meBtn .av{width:40px;height:40px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--muted)}
#meBtn .badge{position:absolute;left:30px;top:-7px;display:flex;align-items:center;gap:3px;padding:3px 8px;border-radius:99px;background:var(--panel);box-shadow:0 1px 8px rgba(0,0,0,.3);font:800 11px/1 Rubik,sans-serif;white-space:nowrap}
#meBtn .badge i{font-style:normal;color:var(--food)}
.top{left:70px;right:70px;transform:none;height:52px;border-radius:16px;padding:0 14px 0 8px;max-width:none;border:0;-webkit-backdrop-filter:none;backdrop-filter:none}
#layersBtn{top:10px;right:10px}
.zoom{right:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;overflow:hidden}
.zoom button{width:52px;height:52px;display:grid;place-items:center}
.zoom button+button{border-top:1px solid var(--line)}
#centerBtn{right:10px;bottom:84px;color:var(--me)}
#centerBtn svg{fill:currentColor;stroke:none}
.pill{left:10px;bottom:84px;height:52px;border-radius:16px;max-width:calc(100% - 84px);border:0;-webkit-backdrop-filter:none;backdrop-filter:none;padding:0 14px 0 12px}
.quick{position:absolute;z-index:600;left:0;right:0;bottom:18px;display:flex;gap:8px;padding:0 10px 4px;overflow-x:auto;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:none;height:52px;display:flex;align-items:center;gap:8px;padding:0 16px 0 14px;font-weight:700;font-size:15px}
.quick svg{width:20px;height:20px}
.quick .accent{background:var(--mine);color:#fff}
.pop{top:70px;right:10px;transform:none}
.dpick,.toast{top:70px}
.leaflet-bottom.leaflet-left{bottom:74px}
.ring circle:first-child{stroke:var(--line)}

.dpill{position:absolute;z-index:600;top:12px;left:12px;height:36px;display:flex;align-items:center;gap:7px;padding:0 13px 0 7px;border-radius:99px;background:var(--panel);box-shadow:0 1px 10px rgba(0,0,0,.1);color:var(--ink)}
.dpill svg{transform:rotate(-90deg);flex:none}
.dpill #dName{display:inline;font:700 13px/1 Rubik,sans-serif;letter-spacing:0}
.dpill #dName::after{content:''}
.dpill #pct{font:600 12.5px/1 Rubik,sans-serif;color:var(--muted)}
#area,#cityLine{display:none!important}
.ib{position:absolute;z-index:600;top:12px;right:12px;width:36px;height:36px;border-radius:50%;background:var(--panel);box-shadow:0 1px 10px rgba(0,0,0,.1);display:grid;place-items:center;color:var(--ink)}
.dock{position:absolute;z-index:600;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:4px;border-radius:99px;background:var(--panel);box-shadow:0 2px 16px rgba(0,0,0,.12)}
.dock button{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.dock button:active{background:var(--soft)}
.dock .plus{background:var(--mine);color:#fff;margin:0 2px}
.dpick{top:56px;left:12px;right:auto;width:min(320px,calc(100% - 24px))}
.toast{top:56px;font-size:13px;padding:8px 10px 8px 12px;max-width:340px;border-radius:14px}
.pop{top:56px;right:12px;left:auto;width:220px;transform:none}
.ptsb{font:700 13px Rubik,sans-serif;color:var(--muted);flex:none;padding:0 4px}
.ptsb b{color:var(--ink)}

:root{--land:#e9e6f5;--water:#a9dcf2;--park:#d4ecc9;--ink:#1b1238;--muted:#6b6490;--panel:#ffffff;--line:#e7e2fb;--soft:#f1eeff;
 --mine:#4b2fd6;--main:#ff5a5f;--local:#18c29c;--food:#ffa826;--me:#4b2fd6;--vio:#4b2fd6;--lime:#c8f43c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--land:#231d40;--water:#1d3a55;--park:#1f3528;--ink:#f3f0ff;--muted:#a59fc6;--panel:#1c1535;--line:#2e2654;--soft:#281f4b;--mine:#8f7bff;--me:#8f7bff;--vio:#6a4ff0}}
:root[data-theme="dark"]{--land:#231d40;--water:#1d3a55;--park:#1f3528;--ink:#f3f0ff;--muted:#a59fc6;--panel:#1c1535;--line:#2e2654;--soft:#281f4b;--mine:#8f7bff;--me:#8f7bff;--vio:#6a4ff0}
body{font-family:Rubik,system-ui,-apple-system,sans-serif}
#ringArc{stroke:var(--vio)}
.dpill #dName{font:600 13.5px/1 Rubik,sans-serif}
.dpill #pct{font:700 13px/1 Rubik,sans-serif;color:var(--vio)}
.dock .plus{background:var(--vio);color:#fff}
#centerBtn{color:var(--vio)}
.tabs button.on{background:var(--soft);color:var(--vio)}
.cta{background:var(--vio)}
.bar i{background:var(--vio)}
.opt.on::after{color:var(--vio)}
.scrim{background:rgba(27,18,56,.45)}
.dot{border-radius:14px;background:var(--soft)}
.tic{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none}
.toast button{background:var(--vio)}
.card.place{background:var(--vio);padding:0;max-height:92%;border-radius:30px 30px 0 0}
.pc-top{position:relative;padding:18px 20px 24px;color:#fff;overflow:hidden}
.pc-top .rings{position:absolute;right:-110px;top:-130px;fill:none;stroke:rgba(255,255,255,.13);stroke-width:2}
.pc-bar{position:relative;display:flex;justify-content:space-between;align-items:center}
.pc-x{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.15);color:#fff;display:grid;place-items:center}
.pc-tag{display:flex;align-items:center;gap:6px;border-radius:11px;padding:7px 11px;font:700 12.5px Rubik,sans-serif;color:#fff}
.pc-top h2{position:relative;margin:20px 0 6px;font:900 30px/1.05 Rubik,sans-serif;letter-spacing:-.01em;color:#fff}
.pc-sub{position:relative;font-size:14px;font-weight:500;color:#d9d2ff}
.pc-body{background:var(--panel);border-radius:30px 30px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.pc-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pc-stats div{background:var(--soft);border-radius:16px;padding:10px 12px;min-width:0}
.pc-stats b{display:block;font:800 18px/1.2 Rubik,sans-serif;color:var(--vio);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-stats span{display:block;font-size:11.5px;font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-story{margin:0;font-size:15.5px;line-height:1.6;color:var(--ink)}
.pc-hint{margin:-4px 0 0;font-size:12.5px;color:var(--muted)}
.pc-cta{width:100%;height:58px;border-radius:18px;background:var(--lime);color:#1b1238;font:800 16px Rubik,sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 0 #8fb21c;text-decoration:none;margin-bottom:4px}
.pc-cta:active{transform:translateY(2px);box-shadow:0 2px 0 #8fb21c}
.pc-done{height:54px;border-radius:18px;background:var(--soft);color:var(--vio);font:700 15px Rubik,sans-serif;display:flex;align-items:center;justify-content:center;gap:8px}
@media (prefers-color-scheme:dark){.pc-stats b{color:var(--lime)}}

.sdot{width:7px;height:7px;border-radius:50%;background:var(--line);display:inline-block;margin-left:2px}
.sdot.ok{background:var(--local)}.sdot.sync{background:var(--vio);animation:sp 1s ease-in-out infinite}.sdot.err{background:var(--main)}
@keyframes sp{50%{opacity:.3}}

async function bgToken(){if(!sb||!user)return null;if(bgTok)return bgTok;
 const {data,error}=await sb.from('bg_tokens').select('token').eq('user_id',user.id).maybeSingle();if(error)throw error;if(data&&data.token)return bgTok=data.token;
 const a=new Uint8Array(24);crypto.getRandomValues(a);const tok=btoa(String.fromCharCode(...a)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
 const r=await sb.from('bg_tokens').insert({user_id:user.id,token:tok});if(r.error)throw r.error;return bgTok=tok}
// точки идут по времени: соседние соединяем и открываем туман вдоль пути, большие скачки не соединяем
function bgApply(rows,quietly){if(!rows||!rows.length)return 0;const before=area.size;let prev=bgLast&&bgLast.p?P(bgLast.p[0],bgLast.p[1]):null,prevT=bgLast&&bgLast.t?Date.parse(bgLast.t):0;quiet=true;
 try{for(const r of rows){if(r.acc!=null&&r.acc>80)continue;const p=P(r.lat,r.lon),tt=Date.parse(r.t);
   if(prev&&tt>prevT){const d=dist(prev,p),dt=(tt-prevT)/1000;if(d<=1500&&d/dt<45)fillLine(prev,p);else{revealAt(p);checkDiscover(p)}}else{revealAt(p);checkDiscover(p)}
   prev=p;prevT=tt}}finally{quiet=false}
 const last=rows[rows.length-1];bgLast={t:last.t,p:[last.lat,last.lon]};try{localStorage.setItem(bgKey(),JSON.stringify(bgLast))}catch(e){}
 bgInfo={n:rows.length,t:last.t};updateHUD();changed=true;dirty=true;const gain=area.size-before;
 if(gain>0&&!quietly)toast(`<div><b>Фоновый GPS</b><br>Открыл туман по пути, пройденному с заблокированным экраном</div>`);return gain}

 try{let q=sb.from('bg_points').select('t,lat,lon,acc').eq('user_id',user.id).order('t',{ascending:true}).limit(2000);if(bgLast&&bgLast.t)q=q.gt('t',bgLast.t);
  const {data,error}=await q;if(error)throw error;if(data&&data.length){bgApply(data);more=data.length===2000}}catch(e){}finally{bgBusy=false}

 $('card').innerHTML=`<button class="close" data-close aria-label="Закрыть">×</button><div class="hd"><span class="big" style="background:var(--vio);color:#fff">${isvg('navi',28,2)}</span><div><h2>Фоновый GPS</h2><div class="zh">Туман открывается, даже когда телефон заблокирован</div></div></div>

 ${bgInfo?`<div class="bgok">${isvg('check',16,2.4)} Последние точки пришли ${new Date(bgInfo.t).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div>`:''}

function osmFind(oid){for(const k in osmData)for(const it of osmData[k]||[])if(it.id===oid)return it;if(metro)for(const s2 of metro.st)if(s2.id===oid)return s2;return null}

 if(id.startsWith('osm:')){const it=osmFind(id.slice(4));if(it)return{name:it.name,lat:it.lat,lon:it.lon,kind:it.lay}}
 if(id.startsWith('mk:')){const q=pubMarks.find(q=>pubKey(q)===id)||(meUid&&marks.find(m=>myKey(m)===id));if(q)return{name:q.name,lat:q.lat,lon:q.lon,kind:'mark'}}
 const s=pstats.get(id),o=OVR.get(id);if(s&&s.lat!=null)return{name:(o&&o.name)||s.name,lat:o&&o.lat!=null?o.lat:s.lat,lon:o&&o.lon!=null?o.lon:s.lon,kind:s.kind};return null}

function ratedBuild(){const out=[],pk=new Set(POIS.map(p=>p.id)),mk=new Set(pubMarks.map(pubKey));if(meUid)for(const m of marks)mk.add(myKey(m));
 const osk=new Set();for(const k in osmData)if(OL[k])for(const it of osmData[k]||[])osk.add('osm:'+it.id);
 for(const [id,s] of pstats){if(pk.has(id)||mk.has(id)||osk.has(id))continue;const pl=placeOf(id);if(!pl||pl.lat==null)continue;
  out.push(Object.assign({id,s,name:pl.name||s.name||'Место',lat:pl.lat,lon:pl.lon,kind:pl.kind||s.kind},P(pl.lat,pl.lon)))}
 RATED=out;dirty=true}

function openAdd(at){draft=null;openForm(null,at)}
function reopenForm(){openForm(draft&&draft.src!=='new'?marks.find(m=>m.id===draft.src)||null:null)}
function formGrab(){if(!draft)return;const n=$('mName'),no=$('mNote'),pb=$('mPub');if(n)draft.name=n.value;if(no)draft.note=no.value;if(pb)draft.pub=pb.checked}
function openForm(q,at){const ed=!!q;
 if(!draft||draft.src!==(q?q.id:'new'))draft={src:q?q.id:'new',type:q?q.type:'place',name:q?q.name:'',note:q?q.note||'':'',photos:q?(q.photos||[]).slice():[],rm:[],pub:q?!!q.pub:false,at:at&&at.x!==undefined?{x:at.x,y:at.y}:null,moved:false};
 const d=draft,where=d.moved?'Место уточнено на карте':d.at?'В выбранной точке на карте':ed?'':(mode==='gps'?'Там, где вы стоите сейчас (GPS)':'В точке, где стоит ваш человечек');

 <label class="fl">Название<input id="mName" maxlength="60" placeholder="Например, лапшичная у моста" value="${esc(d.name)}"></label>
 <div class="types">${Object.entries(MT).map(([k,v])=>`<button data-mt="${k}" class="${k===d.type?'on':''}">${v.e} ${v.n}</button>`).join('')}</div>
 <label class="fl">Заметка<textarea id="mNote" rows="3" placeholder="Что здесь интересного, цены, часы работы">${esc(d.note)}</textarea></label>
 <div class="phs">${d.photos.map((ph,i)=>`<div class="ph"><img ${phSrc(ph)?`src="${esc(phSrc(ph))}"`:''} alt=""><button data-fph="${i}" aria-label="Убрать фото">×</button></div>`).join('')}${d.photos.length<MAXPH?`<label class="ph phadd"><input type="file" accept="image/*" multiple id="fPhoto" hidden><span>📷<br>Добавить фото</span></label>`:''}</div>
 <button class="ghost" data-cur="formmove">📍 ${ed||d.at?'Передвинуть точку на карте':'Уточнить место на карте'}</button>
 <label class="sw"><input type="checkbox" id="mPub" ${d.pub?'checked':''}><span>Показать всем<small>${user?'Метку увидят другие путешественники, смогут оценить её и предложить правку':'Войдите в аккаунт, чтобы делиться метками'}</small></span></label>
 <button class="cta mine" data-savemark>${ed?'Сохранить изменения':'Сохранить отметку'}</button>`;
 $('card').classList.add('on');$('scrim').classList.add('on');if(!ed&&!d.name)setTimeout(()=>$('mName')&&!$('mName').value&&$('mName').focus(),300);
 if(d.photos.some(ph=>!phSrc(ph)&&ph.p&&!ph.tried))signPaths(d.photos).then(()=>{if(draft===d&&$('mName')){formGrab();reopenForm()}})}
function saveForm(){formGrab();const d=draft;if(!d)return;const name=d.name.trim();if(!name){const i=$('mName');if(i){i.focus();i.placeholder='Введите название'}return}
 if(d.pub&&!user){d.pub=false;toast('<div>Чтобы делиться метками, войдите в аккаунт. Сохраняю как личную.</div>')}
 if(d.src==='new'){const[lat,lon]=U(d.at||me),q={id:'m'+Date.now(),lat:+lat.toFixed(6),lon:+lon.toFixed(6),name,note:d.note.trim(),type:d.type,photos:d.photos,pub:d.pub,t:Date.now(),u:Date.now()};
  Object.assign(q,P(q.lat,q.lon));marks.push(q);if(!saveMarks()){marks.pop();return}qMark(q.id);flushSoon();
  pts+=15;changed=true;save();updateHUD();closeCard();draft=null;tab='mine';[...$('tabs').children].forEach(x=>x.classList.toggle('on',x.dataset.t==='mine'));renderSheet();dirty=true;
  toast(`<span style="font-size:22px">${MT[q.type].e}</span><div><b>Отметка сохранена</b><br>+15 очков${q.pub?' · видна всем':''}</div>`);return}
 const q=marks.find(m=>m.id===d.src);if(!q){draft=null;closeCard();return}const bak=JSON.stringify(Object.assign({},q,{photos:null})),bph=q.photos;
 q.name=name;q.note=d.note.trim();q.type=d.type;q.pub=d.pub;q.photos=d.photos;q.rm=(q.rm||[]).concat(d.rm);
 if(d.at){const[la,lo]=U(d.at);q.lat=+la.toFixed(6);q.lon=+lo.toFixed(6);Object.assign(q,P(q.lat,q.lon))}q.u=Date.now();
 if(!saveMarks()){Object.assign(q,JSON.parse(bak),{photos:bph});return}qMark(q.id);flushSoon();draft=null;dirty=true;renderSheet();openMark(q);toast('<div>Отметка обновлена</div>')}
document.addEventListener('change',async e=>{const id=e.target.id;
 if(id==='mPub'&&e.target.checked&&!user){e.target.checked=false;toast('<div>Войдите в аккаунт, чтобы делиться метками</div>');return}
 if(id!=='fPhoto'&&id!=='curPhoto')return;const files=[...(e.target.files||[])];if(!files.length)return;
 if(id==='fPhoto'){if(!draft)return;formGrab();for(const f of files){if(draft.photos.length>=MAXPH)break;try{draft.photos.push({d:await shrink(f)})}catch(err){toast('<div>Не удалось прочитать фото</div>')}}reopenForm();return}
 const c=cur;if(!c||c.kind!=='mark')return;const q=c.obj;q.photos=q.photos||[];let n=0;
 for(const f of files){if(q.photos.length>=MAXPH)break;try{q.photos.push({d:await shrink(f)});n++}catch(err){}}
 if(n){q.u=Date.now();if(!saveMarks()){q.photos.splice(-n);return}qMark(q.id);flushSoon();openMark(q);dirty=true;renderSheet();toast(`<div>Фото добавлено${n>1?': '+n:''}</div>`)}});

// ---- предложить правку (или сразу изменить — автору метки и администратору) ----
function grabSug(){if(!sdraft)return;const n=$('sgName'),no=$('sgNote'),cm=$('sgCom');if(n)sdraft.name=n.value;if(no)sdraft.note=no.value;if(cm)sdraft.comment=cm.value}
function openSuggest(){const c=cur;if(!c)return;if(!user){toast('<div>Войдите, чтобы предлагать правки</div>');openLogin();return}
 const o=c.obj,adm=isAdmin&&!String(c.key).startsWith('mk:'),hasNote=c.kind==='pub'||c.kind==='poi';
 const orig={name:o.name||'',note:c.kind==='pub'?(o.note||''):c.kind==='poi'?(o.s||''):'',lat:o.lat,lon:o.lon};
 if(!sdraft||sdraft.key!==c.key)sdraft={key:c.key,name:orig.name,note:orig.note,at:null,comment:'',orig};
 const s=sdraft,mv=s.at?Math.round(dist({x:o.x,y:o.y},s.at)):0;
 $('card').classList.remove('place');$('card').innerHTML=`<button class="close" data-close aria-label="Закрыть">×</button><h2>${adm?'Изменить место':'Предложить правку'}</h2><div class="zh">${esc(orig.name)} · ${adm?'изменения сразу увидят все':c.kind==='pub'||ownerOf(c.key)?'правку посмотрит автор метки':'правку посмотрит администратор'}</div>
 <label class="fl">Название<input id="sgName" maxlength="80" value="${esc(s.name)}"></label>
 ${hasNote?`<label class="fl">Описание<textarea id="sgNote" rows="4" maxlength="1500">${esc(s.note)}</textarea></label>`:''}
 <button class="ghost" data-cur="sgmove">📍 ${s.at?`Точка сдвинута на ${fmtD(mv)} · изменить`:'Указать верное место на карте'}</button>
 ${adm?'':`<label class="fl">Что не так (необязательно)<textarea id="sgCom" rows="2" maxlength="500" placeholder="Например: вход с другой улицы, место закрылось">${esc(s.comment)}</textarea></label>`}
 <button class="cta" data-sgsend>${adm?'Сохранить':'Отправить'}</button>`;
 $('card').classList.add('on');$('scrim').classList.add('on')}
async function sendSuggest(t){grabSug();const c=cur,s=sdraft;if(!c||!s||!user)return;const ch={},adm=isAdmin&&!String(c.key).startsWith('mk:');
 if(s.name.trim()&&s.name.trim()!==s.orig.name)ch.name=s.name.trim();if((c.kind==='pub'||c.kind==='poi')&&s.note.trim()!==s.orig.note.trim())ch.note=s.note.trim();
 if(s.at){const[la,lo]=U(s.at);ch.lat=+la.toFixed(6);ch.lon=+lo.toFixed(6)}
 if(!Object.keys(ch).length&&!(s.comment||'').trim()){toast('<div>Вы ничего не изменили</div>');return}
 t.disabled=true;
 try{if(adm){await applyOverride(c.key,ch);toast('<div><b>Готово.</b> Место обновлено для всех</div>')}
  else{ch.from={name:s.orig.name,lat:s.orig.lat,lon:s.orig.lon};
   const {error}=await sb.from('suggestions').insert({target:c.key,target_name:s.orig.name,owner_id:c.kind==='pub'?c.obj.user_id:ownerOf(c.key),user_id:user.id,author_name:uname(),changes:ch,comment:(s.comment||'').trim()||null});if(error)throw error;
   toast(`<div><b>Спасибо!</b> ${c.kind==='pub'||ownerOf(c.key)?'Автор метки':'Администратор'} посмотрит правку</div>`);sugLoad()}
  sdraft=null;openCur(c)}catch(e){t.disabled=false;toast(`<div>Не удалось отправить: ${esc(e.message||'ошибка')}</div>`)}}
function sugHTML(){if(!user)return'';let h='';
 if(sugIn.length){h+=`<h4 class="sec">Предложения правок · ${sugIn.length}</h4>`+sugIn.map(r=>{const c=r.changes||{},f=c.from||{},li=[];
   if(c.name)li.push(`Название: «${esc(f.name||r.target_name||'')}» → «${esc(c.name)}»`);
   if(c.lat!=null){const mvd=f.lat!=null?Math.round(dist(P(f.lat,f.lon),P(c.lat,c.lon))):null;li.push(`Место сдвинуто${mvd!=null?' на '+fmtD(mvd):''}`)}
   if(c.note!=null)li.push('Новое описание: '+esc(c.note.slice(0,220))+(c.note.length>220?'…':''));
   return `<div class="sg"><b>${esc(r.target_name||'Место')}</b><span>${esc(r.author_name||'Путешественник')} · ${fdate(Date.parse(r.created_at))}</span>${li.length?`<ul>${li.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}${r.comment?`<p>«${esc(r.comment)}»</p>`:''}<div class="acts"><button class="ghost" data-sg="show:${r.id}">На карте</button><button class="ghost" data-sg="no:${r.id}">Отклонить</button><button class="ghost ok" data-sg="yes:${r.id}">Принять</button></div></div>`}).join('')}
 const mine=sugMine.filter(r=>r.status==='new').length;if(mine)h+=`<p class="note">Ваши правки на проверке: ${mine}</p>`;return h}
async function sugAct(t){const [a,id]=t.dataset.sg.split(':'),r=sugIn.find(x=>String(x.id)===id);if(!r)return;const c=r.changes||{};
 if(a==='show'){closePanel();follow=false;const f=c.from||{},la=c.lat!=null?c.lat:f.lat,lo=c.lon!=null?c.lon:f.lon;if(la!=null){focusAt(la,lo);if(c.lat!=null){pin=P(c.lat,c.lon);dirty=true}}return}
 t.disabled=true;
 try{if(a==='yes'){if(r.target.startsWith('mk:')){const q=marks.find(m=>m.id===r.target.split('/')[1]);if(!q)throw new Error('метка не найдена на этом устройстве, нажмите «Синхронизировать»');
    if(c.name)q.name=c.name;if(c.note!=null)q.note=c.note;if(c.lat!=null){q.lat=c.lat;q.lon=c.lon;Object.assign(q,P(q.lat,q.lon))}q.u=Date.now();saveMarks();qMark(q.id);flushSoon()}
   else await applyOverride(r.target,c)}
  const {error}=await sb.from('suggestions').update({status:a==='yes'?'accepted':'rejected',decided_at:new Date().toISOString()}).eq('id',r.id);if(error)throw error;
  sugIn=sugIn.filter(x=>x!==r);toast(a==='yes'?'<div>Правка принята</div>':'<div>Правка отклонена</div>');renderSheet();dirty=true}
 catch(e){t.disabled=false;toast(`<div>Не получилось: ${esc(e.message||'ошибка')}</div>`)}}

// ---- «Хвалят путешественники» в списке «Рядом» ----
function hotHTML(){const rows=[];for(const [id,s] of pstats){if(s.avg<4)continue;const pl=placeOf(id);if(!pl||pl.lat==null)continue;rows.push({id,s,name:pl.name||s.name||'Место',d:dist(me,P(pl.lat,pl.lon))})}
 rows.sort((a,b)=>(isPop(b.s)-isPop(a.s))||(a.d-b.d));const top=rows.filter(r=>r.d<10000).slice(0,5);
 if(!top.length)return `<p class="note hotnote">★ Ставьте местам звёзды. Когда у места набирается ${POP_N} оценки от 4 и выше, оно подсвечивается золотым на карте у всех.</p>`;
 return `<h4 class="sec">Хвалят путешественники</h4>`+top.map(r=>`<button class="item" data-place="${esc(r.id)}"><span class="dot hotdot">${isvg('star',20,2.2)}</span><span class="t"><b>${esc(r.name)}</b><span>${fmtD(r.d)}, ${walk(r.d)} пешком</span></span><span class="tag${isPop(r.s)?' hotg':''}">★ ${fmtAvg(r.s.avg)} · ${r.s.n}</span></button>`).join('')+`<h4 class="sec">Рядом</h4>`}

 if(t.dataset.mv){moveEnd(t.dataset.mv==='ok');return}
 if(t.dataset.gph!==undefined){lightbox(phSrc(galList[+t.dataset.gph]));return}
 if(t.dataset.fph!==undefined){formGrab();const ph=draft&&draft.photos.splice(+t.dataset.fph,1)[0];if(ph&&ph.p)draft.rm.push(ph.p);reopenForm();return}
 if(t.dataset.place){openPlace(t.dataset.place);return}
 if('sugopen' in t.dataset){$('toast').classList.remove('on');openTab('rank');return}
 if(t.dataset.sg){sugAct(t);return}
 if('sgsend' in t.dataset){sendSuggest(t);return}
 if(t.dataset.cur){const a=t.dataset.cur,c=cur;
  if(a==='formmove'){formGrab();if(!draft)return;const q=draft.src!=='new'?marks.find(m=>m.id===draft.src):null,pt=draft.at||(q?{x:q.x,y:q.y}:{x:me.x,y:me.y});moveStart(pt,'Где стоит метка?',p=>{if(p&&draft){draft.at=p;draft.moved=true}reopenForm()});return}
  if(!c)return;
  if(a==='route'){openRoute(destOf(c));return}
  if(a==='edit'&&c.kind==='mark'){draft=null;openForm(c.obj);return}
  if(a==='suggest'){sdraft=null;openSuggest();return}
  if(a==='sgmove'){grabSug();const o=c.obj;moveStart(sdraft&&sdraft.at||{x:o.x,y:o.y},'Где на самом деле это место?',p=>{if(p&&sdraft)sdraft.at=p;openSuggest()});return}}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-cur],[data-mv],[data-sg],[data-gph],[data-fph],[data-place],[data-sgsend],[data-sugopen],#fogBtn');if(t)commClick(t)});

// ---- долгое нажатие на карту (на iPhone браузер его сам не сообщает) ----
{let lpT=0,lpXY=null,lpFired=false;const mc=map.getContainer(),xy=t=>{const r=mc.getBoundingClientRect();return[t.clientX-r.left,t.clientY-r.top]};
 mc.addEventListener('touchstart',e=>{clearTimeout(lpT);if(e.touches.length!==1||moveMode)return;lpXY=xy(e.touches[0]);lpFired=false;
  lpT=setTimeout(()=>{lpFired=true;setTimeout(()=>{lpFired=false},900);const ll=fromM(map.containerPointToLatLng(lpXY));openPin(P(ll[0],ll[1]));try{navigator.vibrate&&navigator.vibrate(12)}catch(err){}},560)},{passive:true});
 mc.addEventListener('touchmove',e=>{if(!lpXY||!e.touches[0])return;const p=xy(e.touches[0]);if(Math.hypot(p[0]-lpXY[0],p[1]-lpXY[1])>10)clearTimeout(lpT)},{passive:true});
 mc.addEventListener('touchend',()=>clearTimeout(lpT),{passive:true});mc.addEventListener('touchcancel',()=>clearTimeout(lpT),{passive:true});
 // палец отпустили — браузер пришлёт «нажатие», его гасим, иначе карточка сразу закроется
 document.addEventListener('click',e=>{if(lpFired){lpFired=false;e.stopPropagation();e.preventDefault()}},true);mc.addEventListener('touchstart',()=>{},{passive:true})}

// ---- запуск ----
applyOvrAll();ratedBuild();
setTimeout(()=>{ovrLoad();statsLoad();pubLoad()},900);
setInterval(()=>{if(document.visibilityState==='visible'){statsLoad();pubLoad();if(user)sugLoad()}},180000);
if(location.hostname==='test.local')window.__ogc={setStats:rows=>{pstats=new Map(rows.map(r=>[r.poi_id,r]));ratedBuild();mkReset()},setPub:rows=>{pubMarks=rows.map(r=>Object.assign({photos:[]},r,P(r.lat,r.lon)));ratedBuild();mkReset()},
 admin:v=>{isAdmin=v},sug:()=>sugLoad(),login:u=>{user=u;meUid=u?u.id:null},marks:()=>marks,cur:()=>cur,draft:()=>draft,moving:()=>!!moveMode,fog:()=>fogOn,rated:()=>RATED.length};

loadColors();try{buildBase()}catch(e){}revealAt(me);updateHUD();renderSheet();renderPop();renderOL();setTimeout(osmSchedule,1500);
ogReady=true;try{resize()}catch(e){toast('<div>Карта не запустилась: '+esc(e.message)+'</div>')}
try{startGps(false)}catch(e){}
let last=performance.now(),fogSL='',linesSL='',mkSL='';
const fogSig=()=>reveal.size+'|'+visited.size+'|'+base+'|'+isDark()+'|'+fogOn;
const _ids=new WeakMap();let _idn=0;const oid=o=>{if(!o||typeof o!=='object')return 0;let v=_ids.get(o);if(!v){v=++_idn;_ids.set(o,v)}return v};
const linesSig=()=>(route?[oid(route),oid(route.pts),route.idx,route.proj?Math.round(route.proj.x)+','+Math.round(route.proj.y):'',route.approx?1:0].join(','):'-')+'|'+(OL.metro?1:0)+'|'+oid(metro)+'|'+base+'|'+hereD();
let drawFails=0;(function loop(t){const dt=Math.min(.05,Math.max(0,(t-last)/1000));last=t;
 try{step(dt);meTick(t);followTick(dt);if(fmOn&&(t-fmT>300||t-fmLast>1000)){fmLast=t;if(t-fmT>300)fmOn=false;map.fire('moveend')}
  const fs=fogSig();if(fs!==fogSL){fogSL=fs;fogS.need=true}if(born.size||discBorn.size)fogS.need=true;
  const ls=linesSig();if(ls!==linesSL){linesSL=ls;linesS.need=true}
  if(!map._animatingZoom)for(const s of sheets)if(s.need)sheetRender(s);
  if(base!==mkSL){mkSL=base;mkReset()}
  if(dirty){dirty=false;mkQ=true}
  if(mkQ)mkSync();if(meDirty)mePlace()}
 catch(e){if(++drawFails===1)toast('<div>Ошибка отрисовки: '+esc(e.message)+'</div>');console.error(e)}requestAnimationFrame(loop)})(last);
if(location.hostname==='test.local'){window.__ogdbg=()=>({me,meD,follow,mode,z:map.getZoom(),mk:MK.size,area:area.size,theme,dark:isDark()});window.__bgApply=r=>bgApply(r)}
})();
